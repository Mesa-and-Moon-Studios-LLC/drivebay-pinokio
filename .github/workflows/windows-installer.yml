name: Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Port and account helper tests
        run: node --test installer/port.test.mjs installer/account-leave.test.mjs installer/setup-save.test.mjs installer/script-install.test.mjs installer/pending-account.test.mjs installer/server-lock.test.mjs installer/document-routes.test.mjs installer/public-access.test.mjs installer/uninstall.test.mjs installer/android-app.test.mjs installer/api-tokens.test.mjs installer/drivebay-skill.test.mjs

      - name: Build production server
        working-directory: app
        env:
          DRIVEBAY_STANDALONE: "1"
        run: npm run build

      - name: Copy PGLite runtime files
        run: node installer/copy-pglite-assets.mjs

      - name: Smoke test login page
        run: node installer/smoke-test.mjs

      - name: Build tray app
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /win32icon:installer\assets\drivebay.ico /out:installer\DrivebayTray.exe installer\tray\DrivebayTray.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed ($LASTEXITCODE)" }

      - name: Stage installer payload
        run: node installer/stage.mjs

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (Test-Path $makensis) { exit 0 }
          for ($try = 1; $try -le 3; $try++) {
            choco install nsis -y --no-progress
            if (Test-Path $makensis) { exit 0 }
            Write-Host "Chocolatey did not install makensis (attempt $try, exit $LASTEXITCODE)."
            Start-Sleep -Seconds (10 * $try)
          }
          $setup = Join-Path $env:TEMP "nsis-3.11-setup.exe"
          Write-Host "Downloading the NSIS 3.11 installer."
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe" -OutFile $setup
          $proc = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "NSIS setup failed ($($proc.ExitCode))"
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }

      - name: Compile installer
        shell: pwsh
        run: |
          $line = Get-Content -TotalCount 1 VERSION.txt
          if ($line -notmatch '(\d+\.\d+)') { throw "VERSION.txt has no version" }
          $version = $Matches[1]
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v") -and $tag -ne "v$version") {
            throw "Tag $tag does not match v$version from VERSION.txt"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          New-Item -ItemType Directory -Force -Path installer\dist | Out-Null
          Push-Location installer
          try {
            & $makensis "/DVERSION=$version" "/DVERSION4=$version.0.0" "drivebay.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }
          Get-ChildItem installer\dist

      - name: Pack server archive
        shell: pwsh
        run: |
          $dest = "installer\dist\drivebay-server-win-x64.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "installer\staging\*" -DestinationPath $dest
          Get-Item $dest | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drivebay-Setup
          path: |
            installer/dist/*.exe
            installer/dist/*.zip
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Drivebay ${{ github.ref_name }}
          body_path: installer/release-notes.txt
          files: |
            installer/dist/*.exe
            installer/dist/*.zip
          fail_on_unmatched_files: true
