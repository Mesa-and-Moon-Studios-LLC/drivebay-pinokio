name: Windows installer

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Port and account helper tests
        run: node --test installer/port.test.mjs installer/account-leave.test.mjs installer/setup-save.test.mjs installer/script-install.test.mjs installer/pending-account.test.mjs installer/server-lock.test.mjs installer/document-routes.test.mjs installer/public-access.test.mjs installer/uninstall.test.mjs installer/android-app.test.mjs installer/android-client.test.mjs installer/byte-range.test.mjs installer/api-tokens.test.mjs installer/drivebay-skill.test.mjs installer/donate.test.mjs installer/reset-password.test.mjs installer/remote-actions.test.mjs installer/stop-all.test.mjs

      - name: Build production server
        working-directory: app
        env:
          DRIVEBAY_STANDALONE: "1"
        run: npm run build

      - name: Copy PGLite runtime files
        run: node installer/copy-pglite-assets.mjs

      - name: Smoke test login page
        run: node installer/smoke-test.mjs

      - name: Build tray app
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /win32icon:installer\assets\drivebay.ico /out:installer\DrivebayTray.exe installer\tray\DrivebayTray.cs installer\tray\PhoneMount.cs installer\tray\PhoneMountLogic.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed ($LASTEXITCODE)" }

      - name: Stage installer payload
        run: node installer/stage.mjs

      - name: Install NSIS
        shell: pwsh
        run: |
          $dest = "${env:ProgramFiles(x86)}\NSIS"
          $makensis = Join-Path $dest "makensis.exe"
          if (Test-Path $makensis) { exit 0 }
          $zip = Join-Path $env:TEMP "nsis-3.11.zip"
          curl.exe -fsSL -L -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed ($LASTEXITCODE)" }
          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) { throw "NSIS download is too small ($size bytes)" }
          $unpack = Join-Path $env:TEMP "nsis-3.11-unpack"
          if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $unpack
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $unpack "nsis-3.11\*") -Destination $dest -Recurse -Force
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }

      - name: Compile installer
        shell: pwsh
        run: |
          $line = Get-Content -TotalCount 1 VERSION.txt
          if ($line -notmatch '(\d+\.\d+(\.\d+)?)') { throw "VERSION.txt has no version" }
          $version = $Matches[1]
          $parts = @($version.Split('.')) + @('0','0','0')
          $version4 = ($parts[0..3] -join '.')
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v") -and $tag -ne "v$version") {
            throw "Tag $tag does not match v$version from VERSION.txt"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }
          New-Item -ItemType Directory -Force -Path installer\dist | Out-Null
          Push-Location installer
          try {
            & $makensis "/DVERSION=$version" "/DVERSION4=$version4" "drivebay.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }
          Get-ChildItem installer\dist

      - name: Pack server archive
        shell: pwsh
        run: |
          $dest = "installer\dist\drivebay-server-win-x64.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "installer\staging\*" -DestinationPath $dest
          Get-Item $dest | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drivebay-Setup
          path: |
            installer/dist/*.exe
            installer/dist/*.zip
          if-no-files-found: error

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Drivebay ${{ github.ref_name }}
          body_path: installer/release-notes.txt
          files: |
            installer/dist/*.exe
            installer/dist/*.zip
          fail_on_unmatched_files: true
